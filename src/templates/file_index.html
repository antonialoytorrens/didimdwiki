<article class="listing-page">
	<h1>Files</h1>
	$NOTICE$
	<form class="upload" method="post" action="/files"
	    enctype="multipart/form-data">
		<input type="hidden" name="csrf" value="$CSRF$">
		<input type="hidden" name="action" value="upload">
		<input type="file" name="file" required aria-label="File to upload">
		<button type="submit">Upload</button>
	</form>
	<p class="meta">
		$COUNT$ files &middot; sort by
		<a href="/files?sort=name">name</a> &middot;
		<a href="/files?sort=mtime">newest</a>
		&middot; reference one in a page with
		<code>![alt](/files/name.png)</code>
	</p>
	<table class="listing">
		<thead>
			<tr><th>File</th><th>Type</th><th>Size</th><th>Uploaded</th><th>By</th><th></th></tr>
		</thead>
		<tbody>
			$ROWS$
		</tbody>
	</table>
	$EMPTY$
</article>

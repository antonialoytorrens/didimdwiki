<article class="diff">

		Revision $STAMP$ compared with the current page &middot;
		<a href="/wiki/$NAME_URL$?history=1">history</a> &middot;
		<a href="/wiki/$NAME_URL$">current page</a>
	</p>
	<div class="difftext">
$DIFF$
	</div>

		</div>
	</form>

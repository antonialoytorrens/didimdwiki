sonar.projectKey=didimdwiki
sonar.projectName=didimdwiki
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.exclusions=**/external/**,**/debian/**,**/public/**,**/data/**
sonar.cxx.file.suffixes=.c,.h
sonar.cxx.errorRecoveryEnabled=true
sonar.cxx.cppcheck.reportPaths=report/cppcheck-report.xml
sonar.cxx.clangtidy.reportPaths=report/clang-tidy-report.txt
sonar.cxx.coverage.reportPaths=report/coverage.xml
sonar.cxx.includeDirectories=include,src,src/includes
